<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes Locations</title>
<meta name="description" content="Quittances, paiements et attestations d'assurance">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Locations">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="titre">Mes Locations</h1>
    </div>
    <button class="icon-btn" id="btnRefresh" aria-label="Actualiser">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div id="demoBadge" class="demo-badge" hidden>Mode démo — aucune donnée réelle</div>
  <main id="vue" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="accueil" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span>
    </button>
    <button data-tab="paiements">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg><span>Paiements</span>
    </button>
    <button data-tab="historique">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>Historique</span>
    </button>
    <button data-tab="reglages">
      <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Réglages</span>
    </button>
  </nav>
</div>

<div id="sheetBackdrop" class="backdrop" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-handle"></div>
  <div id="sheetBody"></div>
</section>

<div id="toast" class="toast" role="status" hidden></div>
<div id="loader" class="loader" hidden><div class="spinner"></div><p id="loaderTxt">Envoi en cours…</p></div>

<script src="app.js"></script>
</body>
</html>
